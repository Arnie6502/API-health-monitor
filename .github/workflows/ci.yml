# API Health Monitor — CI: lint → test → build image
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.16.2
      - run: ruff check app tests

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -p no:cacheprovider
        env:
          AHM_DATABASE_URL: sqlite+aiosqlite:///:memory:
          AHM_SCHEDULER_ENABLED: "false"
      - name: Enforce coverage threshold
        run: pytest --cov=app --cov-fail-under=80 -p no:cacheprovider --co -q
        env:
          AHM_DATABASE_URL: sqlite+aiosqlite:///:memory:
          AHM_SCHEDULER_ENABLED: "false"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: api-health-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional bonus: container vulnerability scan with Trivy.
  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: api-health-monitor:ci
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-health-monitor:ci
          severity: CRITICAL,HIGH
          exit-code: "0"  # advisory; flip to 1 to fail CI on vulns
